name: wagering

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    # Pinned: newer LocalStack images require an auth token.
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - "${LOCALSTACK_HOST_PORT:-4566}:4566"
    volumes:
      - ./infra/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 2s
      timeout: 3s
      retries: 60

  migrate:
    build: .
    profiles: ["app"]
    command: ["bun", "scripts/migrate.ts", "up"]
    environment: &app-env
      DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    profiles: ["app"]
    environment:
      <<: *app-env
      PORT: "3000"
    ports:
      - "${APP_HOST_PORTS:-3001-3003}:3000"
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  pgdata:
